# Athena MCP 套件聚合部署（causal-memory.com/hub 统一入口）
# 构建: docker compose build
# 启动: docker compose up -d
# 密钥不进仓库：licenses.json 挂卷注入；MCPHub admin 密码走 .env（MCPHUB_ADMIN_PASSWORD）
x-common: &common
  restart: unless-stopped
  environment:
    TZ: Asia/Shanghai
    MCP_LICENSE_FILE: /app/licenses/licenses.json
    MCP_USAGE_DIR: /app/usage
    MCP_WORKERS: "2"

services:
  factor-miner:
    <<: *common
    build:
      context: ./factor-miner-mcp
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    image: factor-miner-mcp:server
    container_name: mcp-factor-miner
    ports:
      - "127.0.0.1:50053:50053"
    environment:
      TZ: Asia/Shanghai
      MCP_LICENSE_FILE: /app/licenses/licenses.json
      MCP_USAGE_DIR: /app/usage
      MCP_WORKERS: "2"
      FACTOR_MINER_DATA_DIR: /app/data/factor_mining
      FACTOR_MINER_MODEL_DIR: /app/models
      # redis 端口只绑 127.0.0.1（安全考虑），容器经 host.docker.internal 连宿主 IP
      # 会 Connection refused；本 compose 各服务同在 default bridge 上，走服务名 DNS。
      REDIS_URL: redis://redis:6379/0
      # ── qrun 拆出去跑 ──
      # 设了 URL，factor_backtest/factor_oos_check 的第 4 步就交给 factor-executor；
      # 留空则回到本地执行（行为与拆分前一致）。
      FACTOR_EXECUTOR_URL: http://factor-executor:50054
      # conf 里 qlib_init.provider_uri 要写成**执行器**容器内的路径
      FACTOR_EXECUTOR_PROVIDER_URI: /qlib_data/cn_data
      # backtest 产物落到共享卷（原来在 /tmp 里，容器重建即丢且无 TTL 清理）
      FACTOR_MINER_BACKTEST_DIR: /work/backtests
      FACTOR_MINER_JOBS_DIR: /work/jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/athena-mcp/qlib_data:/app/.qlib/qlib_data
      - /opt/athena-mcp/data/factor_mining:/app/data/factor_mining
      - /opt/athena-mcp/models:/app/models
      - /opt/athena-mcp/licenses/licenses.json:/app/licenses/licenses.json:ro
      - /opt/mcp-suite/usage/factor-miner:/app/usage
      # 与 factor-executor 同挂同一宿主目录到**同一容器路径** /work：
      # 请求里传的是路径不是文件内容，两边路径不一致就会互相看不见。
      - /opt/mcp-suite/backtests:/work

  # qrun 执行器：把全市场 LGBM 训练 + 组合回测从 miner 容器里搬出来。
  #
  # 动机是实测故障：qrun 内存 GB 级，而 miner 被限制在 1536m，撞顶时**内核 memcg
  # 杀掉的是整个 miner 容器**；失败的 qrun 还会变孤儿进程把容器卡死到只能重启。
  # 这里给它自己的 cgroup 和显式上限，失败只影响这一个 job。
  #
  # 与 miner 共用同一个镜像（同一份代码），command 换成执行器入口。
  factor-executor:
    <<: *common
    build:
      context: ./factor-miner-mcp
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    image: factor-miner-mcp:server
    container_name: mcp-factor-executor
    # 不上限就等于把当初那条护栏（单容器拖垮整机）拆了 —— 给足 qrun 的余量，
    # 但仍然是个上限：失控时死自己，不拖整机。
    # 上限必须**小于整机内存**（7456m），否则 cgroup 永远不会触发：
    # 2026-09-21 这台机器因此静默冻结 4 次（qrun 1.5G + 常驻 2.2G python → load 30 → 谁都不响应）。
    # 2600m 让失控的 qlib 任务死在容器里，而不是拖死整机。
    mem_limit: 4600m
    memswap_limit: 4600m
    command: ["python3", "-m", "factor_executor.server"]
    environment:
      TZ: Asia/Shanghai
      EXECUTOR_JOB_ROOT: /work
      EXECUTOR_QLIB_ROOT: /qlib_data
      EXECUTOR_PANEL_H5: /data/factor_mining/daily_pv_all.h5
      # qrun 子进程的 RLIMIT_AS；比容器上限略低，让它先于容器被 kill
      EXECUTOR_MEM_LIMIT_MB: "7168"
      EXECUTOR_TIMEOUT: "1800"
    volumes:
      - /opt/mcp-suite/backtests:/work
      # ⚠️ 必须挂 qlib_data 这一层（祖父目录）：日更的 atomic_swap 会整体 rename
      # 替换 cn_data，挂更深的子目录会在一次日更后指向已被删除的 inode。
      - /opt/athena-mcp/qlib_data:/qlib_data:ro
      # 只用来做数据版本校验（读 manifest.json），不参与计算
      - /opt/athena-mcp/data/factor_mining:/data/factor_mining:ro

  astock-data:
    <<: *common
    build:
      context: ./astock-data-mcp
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    image: astock-data-mcp:server
    container_name: mcp-astock-data
    ports:
      - "127.0.0.1:50052:50052"
    volumes:
      - /opt/athena-mcp/licenses/licenses.json:/app/licenses/licenses.json:ro
      - /opt/mcp-suite/usage/astock-data:/app/usage
      # 本地全市场代码表（factor-miner 日更维护）：get_a_trade_universe /
      # get_a_market_snapshot 的兜底来源。东财 clist 会返 502/静默截断分页，
      # 没有这条兜底时 universe 类工具会整体不可用。
      # ⚠️ 必须挂**祖父目录** qlib_data，不能挂 cn_data/instruments：日更的
      # atomic_swap 会把整个 cn_data 目录 rename 掉（inode 变更），挂深层子目录
      # 会一直指向已被删除的旧 inode → 容器里报 No such file（2026-09-14 实际发生）。
      - /opt/athena-mcp/qlib_data:/app/.qlib/qlib_data:ro

  global-data:
    <<: *common
    build:
      context: ./global-data-mcp
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    image: global-data-mcp:server
    container_name: mcp-global-data
    ports:
      - "127.0.0.1:50058:50058"
    volumes:
      - /opt/athena-mcp/licenses/licenses.json:/app/licenses/licenses.json:ro
      - /opt/mcp-suite/usage/global-data:/app/usage

  causal:
    <<: *common
    build:
      context: ./causal-mcp
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    image: causal-mcp:server
    container_name: mcp-causal
    ports:
      - "127.0.0.1:50057:50057"
    volumes:
      - /opt/athena-mcp/licenses/licenses.json:/app/licenses/licenses.json:ro
      - /opt/mcp-suite/usage/causal:/app/usage

  kronos:
    <<: *common
    build:
      context: ./kronos-mcp
      args:
        HF_ENDPOINT: https://hf-mirror.com
    image: kronos-mcp:latest
    container_name: mcp-kronos
    ports:
      - "127.0.0.1:50059:50059"
    volumes:
      - /opt/athena-mcp/licenses/licenses.json:/app/licenses/licenses.json:ro
      - /opt/mcp-suite/usage/kronos:/app/usage

  workbench:
    <<: *common
    build:
      context: ./workbench-mcp
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    image: workbench-mcp:server
    container_name: mcp-workbench
    ports:
      - "127.0.0.1:50062:50062"
    environment:
      TZ: Asia/Shanghai
      WB_DB: /data/workbench.db
      WB_H5: /data/daily_pv_all.h5
      WB_START: "2024-01-01"
      MCP_LICENSE_KEY: ${MCP_LICENSE_KEY:-}
      # 人类专属工具（wb_admit/wb_reject/wb_retire）的身份凭据。未配置则这些
      # 工具一律拒绝（fail-closed）—— 见 spine/server.py 的 _require_human_token。
      WB_HUMAN_TOKEN: ${WB_HUMAN_TOKEN:?在 .env 里配置}
    volumes:
      - /opt/quant-workbench/data:/data
      - /opt/athena-mcp/data/factor_mining/daily_pv_all.h5:/data/daily_pv_all.h5:ro
      - /opt/athena-mcp/qlib_data:/app/.qlib/qlib_data:ro
      - /opt/mcp-suite/usage/workbench:/app/usage

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # 纯 dfactor 缓存（TTL 48h），无需持久化

  mcphub:
    image: samanhappy/mcphub:latest
    container_name: mcphub
    restart: unless-stopped
    network_mode: host   # 需要访问 127.0.0.1 上的后端 MCP
    environment:
      PORT: "3100"   # host 网络下绑 0.0.0.0，由 systemd/mcphub-firewall.service 挡公网
      BASE_PATH: /hub
      ADMIN_PASSWORD: ${MCPHUB_ADMIN_PASSWORD:?在 .env 里配置}
    volumes:
      - /opt/mcp-hub/mcp_settings.json:/app/mcp_settings.json
      - /opt/mcp-hub/data:/app/data

  # 统一配额管控：挡在 mcphub 前，per-key × per-group 计量/配额，SSE 透传
  # nginx /hub/ 改指 :3200，/quota/ 管理台走 :3300（详见 quota-platform/README.md）
  quota-platform:
    image: python:3.12-slim
    container_name: quota-platform
    restart: unless-stopped
    network_mode: host   # 与 mcphub 同机：上游 127.0.0.1:3100；nginx 回源 127.0.0.1:3200/3300
    environment:
      WB_BASE: http://127.0.0.1:50062
      TZ: Asia/Shanghai
      QUOTA_ADMIN_TOKEN: ${QUOTA_ADMIN_TOKEN:?在 .env 里配置}
      # 与 workbench 共享：_wb_call 转发 wb_admit/wb_reject/wb_retire 时注入
      WB_HUMAN_TOKEN: ${WB_HUMAN_TOKEN:?在 .env 里配置}
      # API key 自助申请：建 key 用的 mcphub「system + all-access」key。
      # 用 :- 而非 :? —— 缺它只影响"审批建 key"这一功能（管理台会显式提示、
      # 审批接口返 502 带原因），不该让挡在全部 MCP 流量前的这一层起不来。
      MCPHUB_ADMIN_KEY: ${MCPHUB_ADMIN_KEY:-}
    volumes:
      - ./quota-platform:/app
      - /opt/mcp-hub/mcp_settings.json:/mnt/mcp_settings.json:ro   # key 库存只读挂载
      - /opt/mcp-suite/quota-platform:/data                        # config.json + quota.db 持久化
    command: python /app/server.py --config /data/config.json --db /data/quota.db

  # 官网 Next.js 走 systemd 裸进程（见 systemd/causal-memory-web.service），不在本编排内

  causal-memory:
    build:
      context: ./causal-memory-src
      dockerfile: Dockerfile.server
    image: causal-memory:server
    container_name: mcp-causal-memory
    ports:
      - "127.0.0.1:50061:50061"
    environment:
      TZ: Asia/Shanghai
      CAUSAL_MEMORY_HTTP_AUTH_TOKEN: ${CAUSAL_MEMORY_HTTP_AUTH_TOKEN}
      # 多租户模式：/mcp bearer 鉴权 + 每租户独立 DB（tenants/ 子目录）
      # 目录模式：合并 /tokens 下全部 *.json（tokens.json=运维手工管理，cloud.json=官网 dashboard 桥接）
      CAUSAL_MEMORY_TOKENS_FILE: /tokens
      # 本地 ONNX 向量化（local-embed，bge-small-zh，中文场景）
      CAUSAL_MEMORY_LOCAL_EMBED_MODEL: BAAI/bge-small-zh-v1.5
      FASTEMBED_CACHE_DIR: /root/.local/share/causal-memory/.fastembed_cache
      ORT_DYLIB_PATH: /opt/onnxruntime/libonnxruntime.so.1.24.1
    volumes:
      # causal-memory 忽略 XDG_DATA_HOME，固定写 $HOME/.local/share/causal-memory
      - /opt/mcp-suite/causal-memory/cm-data-home:/root/.local/share/causal-memory
      - /opt/mcp-suite/causal-memory/tokens:/tokens:ro
      - /opt/onnxruntime:/opt/onnxruntime:ro
    restart: unless-stopped
