<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>申请 API Key · quota-platform</title>
<style>
  :root {
    --bg: #08090c; --panel: #0e1116; --line: #1e242e; --text: #e6e9ef;
    --muted: #8b95a5; --accent: #4da3ff; --ok: #3ec97a; --bad: #ff6b6b; --warn: #ffb84d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 28px; font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 22px; margin-bottom: 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  label .req { color: var(--bad); }
  input, textarea, select {
    width: 100%; background: #0b0d11; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 11px; font: 13px/1.5 inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 76px; resize: vertical; }
  .mono { font-family: var(--mono); }
  .groups { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .grp { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px;
         border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .grp:hover { border-color: #2c3542; }
  .grp input { width: auto; margin: 3px 0 0; }
  .grp .name { font-weight: 600; }
  .grp .desc { color: var(--muted); font-size: 12px; }
  button { border: 0; border-radius: 8px; padding: 11px 18px; font-size: 14px;
           font-weight: 700; cursor: pointer; background: var(--accent); color: #05070a; }
  button.ghost { background: #1a1f28; color: var(--text); border: 1px solid var(--line);
                 font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 20px; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 20px; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .reqno { font-family: var(--mono); font-size: 22px; letter-spacing: 1px;
           color: var(--accent); font-weight: 700; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; margin-top: 10px;
        font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  pre { background: #0b0d11; border: 1px solid var(--line); border-radius: 8px;
        padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 12px; margin: 10px 0 0; }
  .tok { background: #0b0d11; border: 1px solid var(--ok); border-radius: 8px;
         padding: 14px; font-family: var(--mono); font-size: 14px; word-break: break-all;
         margin-top: 10px; }
  .note { border-left: 3px solid var(--warn); padding-left: 12px; color: var(--muted);
          font-size: 12.5px; margin: 14px 0 0; }
  .note.bad { border-color: var(--bad); }
  .pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px;
          border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: #235c3d; }
  .pill.bad { color: var(--bad); border-color: #6b2b2b; }
  .pill.warn { color: var(--warn); border-color: #6b552b; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 30px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>申请 API Key</h1>
  <p class="sub">
    MCP 量化数据/分析服务自助申请。<strong>提交后需管理员审批</strong>，通过后凭申请单号自助领取密钥。
  </p>

  <!-- ── 第一步：申请 ── -->
  <div class="card" id="card-apply">
    <h2>填写申请</h2>
    <form id="form-apply">
      <label>称呼 / 团队名 <span class="req">*</span></label>
      <input id="f-name" maxlength="60" placeholder="例如：张三 / 某某量化团队" required />

      <label>联系方式 <span class="req">*</span></label>
      <input id="f-contact" maxlength="120" placeholder="邮箱或微信号（审批结果需据此通知你）" required />

      <label>用途说明</label>
      <textarea id="f-purpose" maxlength="500"
        placeholder="例如：A 股行情+因子回测，做个股研报辅助；预计 5-10 人使用"></textarea>

      <label>需要哪些分组 <span class="req">*</span></label>
      <div class="groups" id="groups"><span class="pill">加载中…</span></div>

      <label>预计调用量</label>
      <input id="f-volume" maxlength="60" placeholder="例如：每天 2000 次 / 每月 3 万次" />

      <div class="row">
        <button type="submit" id="btn-apply">提交申请</button>
        <span class="msg" id="msg-apply"></span>
      </div>
    </form>
  </div>

  <!-- ── 提交成功：申请单号 ── -->
  <div class="card" id="card-done" style="display:none">
    <h2>申请已提交 ✅</h2>
    <p class="sub" style="margin:8px 0 4px">请记下你的申请单号，审批通过后凭它领取密钥：</p>
    <div class="reqno" id="done-reqno"></div>
    <div class="row">
      <button class="ghost" id="btn-copy-reqno">复制单号</button>
      <button class="ghost" id="btn-query">查询审批状态</button>
      <span class="msg" id="msg-done"></span>
    </div>
    <p class="note">单号即领取凭据，请勿公开转发。审批通过后到下面「查询 / 领取」处输入单号取密钥。</p>
  </div>

  <!-- ── 第二步：查询 / 领取 ── -->
  <div class="card">
    <h2>查询 / 领取密钥</h2>
    <label>申请单号</label>
    <div class="row" style="margin-top:0">
      <input id="q-reqno" class="mono" style="flex:1;min-width:200px" placeholder="REQ-XXXXXXXX" />
      <button class="ghost" id="btn-status">查询状态</button>
      <button id="btn-pickup">领取密钥</button>
    </div>
    <div class="msg" id="msg-query"></div>
    <div id="status-box"></div>
    <div id="pickup-box"></div>
  </div>

  <footer>quota-platform · 密钥仅用于你申请的服务分组</footer>
</div>

<script>
const $ = id => document.getElementById(id);
// 相对路径：经 nginx /quota/ 反代时不能发 /api/* 绝对路径（会落到官网）
const api = p => p.replace(/^\//, '');
let LAST_REQNO = '';

function msg(el, text, cls) {
  const n = $(el);
  n.textContent = text || '';
  n.className = 'msg' + (cls ? ' ' + cls : '');
}

async function post(path, body) {
  const r = await fetch(api(path), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  let j = {};
  try { j = await r.json(); } catch (_) { /* 非 JSON */ }
  return { ok: r.ok, status: r.status, body: j };
}

async function get(path) {
  const r = await fetch(api(path));
  let j = {};
  try { j = await r.json(); } catch (_) { /* 非 JSON */ }
  return { ok: r.ok, status: r.status, body: j };
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ── 加载可选分组 ── */
async function loadMeta() {
  const { body } = await get('/api/apply/meta');
  const box = $('groups');
  if (!body || !body.groups || !body.groups.length) {
    box.innerHTML = '<span class="pill bad">暂时无法申请（服务端未配置分组）</span>';
    return;
  }
  box.innerHTML = body.groups.map(g => `
    <label class="grp">
      <input type="checkbox" value="${esc(g.name)}" />
      <span><span class="name">${esc(g.name)}</span>
        <span class="desc">${esc(g.label)}</span></span>
    </label>`).join('');
}

/* ── 提交申请 ── */
$('form-apply').addEventListener('submit', async ev => {
  ev.preventDefault();
  const groups = [...document.querySelectorAll('#groups input:checked')].map(i => i.value);
  if (!groups.length) return msg('msg-apply', '请至少选择一个分组', 'err');
  const btn = $('btn-apply');
  btn.disabled = true;
  msg('msg-apply', '提交中…');
  const { ok, body } = await post('/api/apply', {
    name: $('f-name').value.trim(),
    contact: $('f-contact').value.trim(),
    purpose: $('f-purpose').value.trim(),
    volume: $('f-volume').value.trim(),
    groups,
  });
  btn.disabled = false;
  if (!ok) return msg('msg-apply', body.hint || body.error || '提交失败', 'err');
  LAST_REQNO = body.req_no;
  $('done-reqno').textContent = body.req_no;
  $('card-done').style.display = '';
  $('card-apply').style.display = 'none';
  msg('msg-apply', '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

$('btn-copy-reqno').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(LAST_REQNO); msg('msg-done', '已复制', 'ok'); }
  catch (_) { msg('msg-done', '复制失败，请手动选中', 'err'); }
});

$('btn-query').addEventListener('click', () => {
  $('q-reqno').value = LAST_REQNO;
  $('btn-status').click();
});

/* ── 状态查询 ── */
const STATUS_TEXT = {
  pending: ['pending', '审批中 —— 管理员尚未处理'],
  approved: ['ok', '已通过审批'],
  rejected: ['bad', '已拒绝'],
  revoked: ['bad', '已停用'],
};

function fmtTs(ts) {
  return ts ? new Date(ts * 1000).toLocaleString('zh-CN', { hour12: false }) : '—';
}

$('btn-status').addEventListener('click', async () => {
  const no = $('q-reqno').value.trim().toUpperCase();
  if (!no) return msg('msg-query', '请输入申请单号', 'err');
  msg('msg-query', '查询中…');
  $('pickup-box').innerHTML = '';
  const { ok, body } = await get('/api/apply/' + encodeURIComponent(no));
  if (!ok) {
    $('status-box').innerHTML = '';
    return msg('msg-query', body.hint || body.error || '查询失败', 'err');
  }
  const [cls, text] = STATUS_TEXT[body.status] || ['', body.status];
  let html = `<div style="margin-top:14px"><span class="pill ${cls}">${esc(text)}</span></div><dl class="kv">`
    + `<dt>申请单号</dt><dd class="mono">${esc(body.req_no)}</dd>`
    + `<dt>称呼</dt><dd>${esc(body.name)}</dd>`
    + `<dt>提交时间</dt><dd>${fmtTs(body.created_at)}</dd>`;
  if (body.granted_groups && body.granted_groups.length) {
    html += `<dt>已授权分组</dt><dd>${body.granted_groups.map(esc).join('、')}</dd>`;
  }
  if (body.status === 'approved') {
    html += `<dt>领取状态</dt><dd>${body.picked_at ? '已领取（' + fmtTs(body.picked_at) + '）' : '未领取'}</dd>`;
  }
  html += '</dl>';
  if (body.reject_reason) html += `<p class="note bad">拒绝理由：${esc(body.reject_reason)}</p>`;
  if (body.hint) html += `<p class="note">${esc(body.hint)}</p>`;
  $('status-box').innerHTML = html;
  msg('msg-query', '');
  $('btn-pickup').disabled = body.status !== 'approved' || !body.claimable;
});

/* ── 领取密钥 ── */
$('btn-pickup').addEventListener('click', async () => {
  const no = $('q-reqno').value.trim().toUpperCase();
  if (!no) return msg('msg-query', '请输入申请单号', 'err');
  msg('msg-query', '领取中…');
  const { ok, body } = await post('/api/apply/' + encodeURIComponent(no) + '/pickup');
  if (!ok) return msg('msg-query', body.hint || body.error || '领取失败', 'err');
  const acc = body.access || {};
  const urls = (acc.per_group || []).map(g =>
    `<div class="mono" style="margin-top:4px">${esc(g.group)} → ${esc(g.url)}</div>`).join('');
  $('pickup-box').innerHTML = `
    <div style="margin-top:18px">
      <h2>你的密钥 <span class="pill ok">仅显示这一次</span></h2>
      <div class="tok" id="tok-box">${esc(body.token)}</div>
      <div class="row">
        <button id="btn-copy-tok">复制密钥</button>
        <span class="msg" id="msg-tok"></span>
      </div>
      <p class="note">密钥已从服务器抹除，<strong>刷新或关闭本页就无法再看到</strong>，请立即保存。</p>
      <h2 style="margin-top:22px">接入方式</h2>
      <dl class="kv">
        <dt>密钥名</dt><dd class="mono">${esc(body.key_name)}</dd>
        <dt>授权分组</dt><dd>${(body.groups || []).map(esc).join('、')}</dd>
        <dt>请求头</dt><dd class="mono">${esc(acc.header || 'Authorization: Bearer <你的密钥>')}</dd>
      </dl>
      <div style="margin-top:8px">${urls}</div>
      <p class="note bad">${esc(acc.note || '')}</p>
      <p style="margin:14px 0 0;font-size:12px;color:var(--muted)">Claude Desktop 等客户端配置示例：</p>
      <pre>${esc(JSON.stringify(acc.example_claude_desktop || {}, null, 2))}</pre>
    </div>`;
  $('btn-copy-tok').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(body.token);
      $('msg-tok').textContent = '已复制';
      $('msg-tok').className = 'msg ok';
    } catch (_) {
      $('msg-tok').textContent = '复制失败，请手动选中';
      $('msg-tok').className = 'msg err';
    }
  });
  msg('msg-query', '');
  $('btn-pickup').disabled = true;
});

/* 单号输入自动大写 */
$('q-reqno').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });

/* 支持 ?req=REQ-XXXX 直达查询 */
const qs = new URLSearchParams(location.search);
if (qs.get('req')) { $('q-reqno').value = qs.get('req'); $('btn-status').click(); }

loadMeta();
</script>
</body>
</html>
