server {
    server_name causal-memory.com www.causal-memory.com;

    # ── Athena 域 MCP（鉴权在应用层：X-License-Key 头）──
    # proxy_pass 末尾斜杠 = 前缀剥离：/factor/mcp → 127.0.0.1:51053/mcp

    # ── 新一代独立 MCP 仓（mcp-suite）──
    location /astock/ {
        proxy_pass http://127.0.0.1:50052/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE/流式逐帧透传
        proxy_read_timeout 3600s;  # 重任务轮询长连接
    }
    location /factor-miner/ {
        proxy_pass http://127.0.0.1:50053/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE/流式逐帧透传
        proxy_read_timeout 3600s;  # 重任务轮询长连接
    }
    location /causal/ {
        proxy_pass http://127.0.0.1:50057/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE/流式逐帧透传
        proxy_read_timeout 3600s;  # 重任务轮询长连接
    }
    location /global/ {
        proxy_pass http://127.0.0.1:50058/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE/流式逐帧透传
        proxy_read_timeout 3600s;  # 重任务轮询长连接
    }
    location /hub/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE/流式逐帧透传
        proxy_read_timeout 3600s;  # 重任务轮询长连接
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/causal-memory.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/causal-memory.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.causal-memory.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = causal-memory.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name causal-memory.com www.causal-memory.com;
    return 404; # managed by Certbot
}
