server {
    server_name causal-memory.com www.causal-memory.com;

    # ── Athena 域 MCP（鉴权在应用层：X-License-Key 头）──
    # proxy_pass 末尾斜杠 = 前缀剥离：/factor/mcp → 127.0.0.1:51053/mcp

    # ── 新一代独立 MCP 仓（mcp-suite）──
    location /astock/ {
        proxy_pass http://127.0.0.1:50052/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE/流式逐帧透传
        proxy_read_timeout 3600s;  # 重任务轮询长连接
    }
    location /factor-miner/ {
        proxy_pass http://127.0.0.1:50053/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE/流式逐帧透传
        proxy_read_timeout 3600s;  # 重任务轮询长连接
    }
    location /causal/ {
        proxy_pass http://127.0.0.1:50057/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE/流式逐帧透传
        proxy_read_timeout 3600s;  # 重任务轮询长连接
    }
    location /global/ {
        proxy_pass http://127.0.0.1:50058/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE/流式逐帧透传
        proxy_read_timeout 3600s;  # 重任务轮询长连接
    }
    # ── quota-platform 管理台（:3300，账号口令登录在应用层）──
    # workbench（可视化量化工作台）：**只放行只读端点**，MCP 工具入口明确拒绝。
    # 2026-09-15：此前 `location /wb/` 整体反代到 50062，于是公网
    # `POST /wb/mcp` 就能直接写台账（实测 wb_report 返回 200 + 完整账本），
    # 而 wb_admit 的身份校验当时只看调用方自报的 approved_by → 可伪造。
    # 人类操作只走配额控制台：那边有会话鉴权，并在服务端转发 human_token。
    location = /wb { return 302 /wb/ui; }
    location /wb/api/report {
        proxy_pass http://127.0.0.1:50062/api/report;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /wb/ui {
        proxy_pass http://127.0.0.1:50062/ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 显式拒绝 MCP 工具入口与兜底（比依赖兜底更明确，避免日后误改）
    location /wb/mcp   { return 403; }
    location /wb/tools { return 403; }
    location /wb/      { return 403; }

    location = /quota { return 301 /quota/; }
    location /quota/ {
        proxy_pass http://127.0.0.1:3300/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 应用侧看不到被剥掉的 /quota 前缀；会话 cookie 的 Path 靠它还原成
        # /quota/，避免浏览器把会话 cookie 发到 /hub/ 的 MCP 调用上
        proxy_set_header X-Forwarded-Prefix /quota;
    }
    location /hub/ {
        # 经 quota-platform(:3200) 统一计量/配额后再进 mcphub(:3100)
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # SSE/流式逐帧透传
        proxy_read_timeout 3600s;  # 重任务轮询长连接
    }
    location /memory/ {
        # 鉴权在应用层：causal-memory /mcp bearer 多租户（CAUSAL_MEMORY_TOKENS_FILE）
        proxy_pass http://127.0.0.1:50061/;
        proxy_http_version 1.1;
        # causal-memory(rmcp) 有 DNS 重绑定防护，Host 必须是白名单地址
        proxy_set_header Host 127.0.0.1:50061;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/causal-memory.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/causal-memory.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.causal-memory.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = causal-memory.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name causal-memory.com www.causal-memory.com;
    return 404; # managed by Certbot
}
